name: PR Checklist Guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  checklist:
    runs-on: ubuntu-latest
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Bind exact native PR commits
        run: |
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$(git rev-parse "$PR_BASE_SHA^{commit}")" = "$PR_BASE_SHA"
          test "$(git rev-parse "$PR_HEAD_SHA^{commit}")" = "$PR_HEAD_SHA"
      - name: Source and secret audit for exact PR history
        run: bash scripts/safe-repo-audit.sh --strict --mode range --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
      - name: Workspace retirement negative regression
        run: python3 -B tests/workspace-retirement.test.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Explicit retired compatibility contracts
        run: node --test tests/dev-v4-stage-a.test.mjs tests/dev-v4-stage-b.test.mjs tests/dev-v4-installed-controller-adapter.test.mjs tests/dev-v4-hook-compatibility.test.mjs
      - name: Determine affected native product tests
        id: native_scope
        run: |
          python3 -B scripts/workspace-ci.py --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" > "$RUNNER_TEMP/native-check-scope.json"
          python3 - "$RUNNER_TEMP/native-check-scope.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          print("product_tests=" + str(report["productTestsRequired"]).lower())
          PY
      - name: Install existing locked project dependencies
        if: ${{ steps.native_scope.outputs.product_tests == 'true' }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Affected native Jest product validation
        if: ${{ steps.native_scope.outputs.product_tests == 'true' }}
        run: npm test -- --runInBand
      - name: PR prose guidance is advisory
        run: echo 'Describe scope, actual validation, risk and rollback. PR prose is not test or release evidence.'
